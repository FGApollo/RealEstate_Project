name: Backend keep-alive

on:
  schedule:
    # Backup only: Supabase Cron is the primary ping scheduler.
    # GitHub can delay or drop scheduled runs; see docs/backend-keep-alive.md.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://realestate-project-2u79.onrender.com/api/health
    steps:
      - name: Ping the Render backend
        shell: bash
        run: |
          echo "Ping started at $(date -u +'%Y-%m-%dT%H:%M:%SZ'), event=$GITHUB_EVENT_NAME"
          status=$(curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 90 --retry 1 --retry-max-time 100 \
            --header 'Cache-Control: no-cache' \
            --write-out '%{http_code}' "$HEALTH_URL?run=$GITHUB_RUN_ID")
          echo "Ping finished at $(date -u +'%Y-%m-%dT%H:%M:%SZ'), HTTP=$status"
          if [[ "$status" != 204 ]]; then
            echo "Expected HTTP 204 from the backend, received $status" >&2
            exit 1
          fi
